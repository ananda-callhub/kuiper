name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.1.0)'
        required: true

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: kuiper

jobs:
  # ===========================================
  # Build binaries for all platforms
  # ===========================================
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: kuiper-linux-amd64
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: kuiper-linux-arm64
            cross: true
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: kuiper-linux-amd64-musl
            cross: true
          # macOS
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: kuiper-darwin-amd64
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: kuiper-darwin-arm64
            cross: false
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: kuiper-windows-amd64.exe
            cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (if needed)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build release binary (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.exe ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 7

  # ===========================================
  # Create GitHub Release
  # ===========================================
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          # Move binaries to release folder
          for dir in artifacts/*/; do
            artifact_name=$(basename "$dir")
            if [ -f "$dir/$artifact_name" ]; then
              cp "$dir/$artifact_name" "release/$artifact_name"
            fi
          done

          # Create checksums
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Get version from tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "VERSION=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Kuiper ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'rc') }}
          generate_release_notes: true
          files: |
            release/*
          body: |
            ## Installation

            ### Quick Install (macOS/Linux)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
            ```

            ### Homebrew (macOS)
            ```bash
            brew install ${{ github.repository_owner }}/kuiper/kuiper
            ```

            ### Cargo (from crates.io)
            ```bash
            cargo install kuiper
            ```

            ### Manual Download
            Download the appropriate binary for your platform from the assets below.

            | Platform | Binary |
            |----------|--------|
            | Linux (x64) | `kuiper-linux-amd64` |
            | Linux (ARM64) | `kuiper-linux-arm64` |
            | Linux (x64 musl) | `kuiper-linux-amd64-musl` |
            | macOS (Intel) | `kuiper-darwin-amd64` |
            | macOS (Apple Silicon) | `kuiper-darwin-arm64` |
            | Windows (x64) | `kuiper-windows-amd64.exe` |

            ### Verify Checksums
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================
  # Publish to crates.io
  # ===========================================
  publish-crates:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref, 'alpha') && !contains(github.ref, 'beta') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}
        continue-on-error: true

  # ===========================================
  # Update Homebrew Formula
  # ===========================================
  homebrew:
    name: Update Homebrew Formula
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref, 'alpha') && !contains(github.ref, 'beta') && !contains(github.ref, 'rc') }}

    steps:
      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Download release assets
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          curl -sL "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/kuiper-darwin-amd64" -o kuiper-darwin-amd64
          curl -sL "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/kuiper-darwin-arm64" -o kuiper-darwin-arm64
          curl -sL "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/kuiper-linux-amd64" -o kuiper-linux-amd64

      - name: Compute checksums
        id: checksums
        run: |
          echo "SHA_DARWIN_AMD64=$(sha256sum kuiper-darwin-amd64 | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "SHA_DARWIN_ARM64=$(sha256sum kuiper-darwin-arm64 | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          echo "SHA_LINUX_AMD64=$(sha256sum kuiper-linux-amd64 | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Checkout homebrew tap
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/homebrew-kuiper
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          SHA_DARWIN_AMD64=${{ steps.checksums.outputs.SHA_DARWIN_AMD64 }}
          SHA_DARWIN_ARM64=${{ steps.checksums.outputs.SHA_DARWIN_ARM64 }}
          SHA_LINUX_AMD64=${{ steps.checksums.outputs.SHA_LINUX_AMD64 }}

          mkdir -p homebrew-tap/Formula

          cat > homebrew-tap/Formula/kuiper.rb << 'FORMULA'
          class Kuiper < Formula
            desc "Multi-model AI orchestrator CLI"
            homepage "https://github.com/${{ github.repository }}"
            version "VERSION_PLACEHOLDER"
            license "MIT"

            on_macos do
              if Hardware::CPU.intel?
                url "https://github.com/${{ github.repository }}/releases/download/vVERSION_PLACEHOLDER/kuiper-darwin-amd64"
                sha256 "SHA_DARWIN_AMD64_PLACEHOLDER"
              else
                url "https://github.com/${{ github.repository }}/releases/download/vVERSION_PLACEHOLDER/kuiper-darwin-arm64"
                sha256 "SHA_DARWIN_ARM64_PLACEHOLDER"
              end
            end

            on_linux do
              url "https://github.com/${{ github.repository }}/releases/download/vVERSION_PLACEHOLDER/kuiper-linux-amd64"
              sha256 "SHA_LINUX_AMD64_PLACEHOLDER"
            end

            def install
              if OS.mac?
                if Hardware::CPU.intel?
                  bin.install "kuiper-darwin-amd64" => "kuiper"
                else
                  bin.install "kuiper-darwin-arm64" => "kuiper"
                end
              else
                bin.install "kuiper-linux-amd64" => "kuiper"
              end
            end

            test do
              assert_match "kuiper", shell_output("#{bin}/kuiper --version")
            end
          end
          FORMULA

          # Replace placeholders
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" homebrew-tap/Formula/kuiper.rb
          sed -i "s/SHA_DARWIN_AMD64_PLACEHOLDER/${SHA_DARWIN_AMD64}/g" homebrew-tap/Formula/kuiper.rb
          sed -i "s/SHA_DARWIN_ARM64_PLACEHOLDER/${SHA_DARWIN_ARM64}/g" homebrew-tap/Formula/kuiper.rb
          sed -i "s/SHA_LINUX_AMD64_PLACEHOLDER/${SHA_LINUX_AMD64}/g" homebrew-tap/Formula/kuiper.rb

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/kuiper.rb
          git diff --staged --quiet || git commit -m "kuiper ${{ steps.version.outputs.VERSION }}"
          git push

  # ===========================================
  # Build and Push Docker Image
  # ===========================================
  docker:
    name: Build Docker Image
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref, 'alpha') && !contains(github.ref, 'beta') }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          FROM rust:1.75-slim as builder
          WORKDIR /app
          COPY . .
          RUN cargo build --release

          FROM debian:bookworm-slim
          RUN apt-get update && apt-get install -y ca-certificates && rm -rf /var/lib/apt/lists/*
          COPY --from=builder /app/target/release/kuiper /usr/local/bin/kuiper
          ENTRYPOINT ["kuiper"]
          EOF

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================
  # Update install script
  # ===========================================
  update-install-script:
    name: Update Install Script Version
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref, 'alpha') && !contains(github.ref, 'beta') && !contains(github.ref, 'rc') }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Update install.sh with latest version
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          sed -i "s/VERSION=.*/VERSION=\"${VERSION}\"/" install.sh || true

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add install.sh
          git diff --staged --quiet || git commit -m "chore: update install.sh to v${{ steps.version.outputs.VERSION }}"
          git push
