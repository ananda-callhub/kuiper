[package]
name = "kuiper"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
description = "Kuiper CLI: multi-model agentic orchestrator for AI tasks"
license = "Apache-2.0"
repository = "https://github.com/yourusername/kuiper"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1", features = ["full", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
reqwest = { version = "0.11", features = ["json", "stream"] }
anyhow = "1.0"
thiserror = "1.0"
dirs = "5.0"
futures = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"
